<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16191E" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <linearGradient id="cobalt-grad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F71FF" />
      <stop offset="100%" stop-color="#2F4FD2" />
    </linearGradient>
  </defs>

  <!-- Obsidian Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />
  
  <!-- Subtle Ambient Cobalt Aura -->
  <circle cx="32" cy="32" r="18" fill="#2F4FD2" opacity="0.25" filter="blur(6px)" />

  <!-- Iconic Grovix Monogram G (Pure Crisp White) -->
  <path
    d="M45.5 19.5 C42 16 37.5 14 32 14 C22.06 14 14 22.06 14 32 C14 41.94 22.06 50 32 50 C41.94 50 50 41.94 50 32 L33 32"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Grovix Cobalt Energy Spark -->
  <circle cx="33" cy="32" r="3.2" fill="url(#cobalt-grad)" />
</svg>